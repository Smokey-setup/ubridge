name: Release Packages

on:
  workflow_dispatch:

jobs:
  build-native:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: libubridge.so
          - os: macos-latest
            artifact: libubridge.dylib
          - os: windows-latest
            artifact: ubridge.dll

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Linux
        if: runner.os == 'Linux'
        run: make

      - name: Build macOS
        if: runner.os == 'macOS'
        run: make

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc make

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: gcc -O3 -Wall -shared -o ubridge.dll ubridge.c

      - name: Verify native library
        shell: bash
        run: test -f "${{ matrix.artifact }}"

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}
          path: ${{ matrix.artifact }}

  package:
    name: Package Release
    runs-on: ubuntu-latest
    needs: build-native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: native-Linux
          path: release-native/linux

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: native-macOS
          path: release-native/macos

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: native-Windows
          path: release-native/windows

      - name: Assemble native libraries
        run: |
          cp release-native/linux/libubridge.so ./libubridge.so
          cp release-native/macos/libubridge.dylib ./libubridge.dylib
          cp release-native/windows/ubridge.dll ./ubridge.dll
          cp libubridge.so ubridge/libubridge.so
          cp libubridge.dylib ubridge/libubridge.dylib
          cp ubridge.dll ubridge/ubridge.dll

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python build tools
        run: python -m pip install --upgrade pip setuptools wheel build

      - name: Build Python package
        run: python -m build

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Node dependencies
        run: npm ci

      - name: Build npm package
        run: npm pack

      - name: Verify release contents
        run: |
          echo "Python distributions:"
          ls -lh dist/

          echo "Native libraries:"
          ls -lh libubridge.so libubridge.dylib ubridge.dll

          echo "npm package:"
          ls -lh ubridge-*.tgz

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: ubridge-release
          path: |
            dist/*
            ubridge-*.tgz
