name: Release Packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: libubridge.so
          - os: macos-latest
            artifact: libubridge.dylib
          - os: windows-latest
            artifact: ubridge.dll

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Linux
        if: runner.os == 'Linux'
        run: make

      - name: Build macOS
        if: runner.os == 'macOS'
        run: make

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc make

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: gcc -O3 -Wall -shared -o ubridge.dll ubridge.c

      - name: Verify native library
        shell: bash
        run: test -f "${{ matrix.artifact }}"

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}
          path: ${{ matrix.artifact }}

  build-python:
    name: Build Python wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build-native

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: native-${{ runner.os }}
          path: native

      - name: Prepare Python native library
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp native/libubridge.so ubridge/libubridge.so
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp native/libubridge.dylib ubridge/libubridge.dylib
          else
            cp native/ubridge.dll ubridge/ubridge.dll
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade pip setuptools wheel build

      - name: Build Python package
        run: python -m build --wheel

      - name: Upload Python wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ runner.os }}
          path: dist/*.whl

  build-npm:
    name: Build and publish npm package
    runs-on: ubuntu-latest
    needs: build-native

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: native-Linux
          path: release-native/linux

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: native-macOS
          path: release-native/macos

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: native-Windows
          path: release-native/windows

      - name: Assemble npm package
        run: |
          cp release-native/linux/libubridge.so ./libubridge.so
          cp release-native/macos/libubridge.dylib ./libubridge.dylib
          cp release-native/windows/ubridge.dll ./ubridge.dll

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install Node dependencies
        run: npm ci

      - name: Pack npm package
        run: npm pack

      - name: Verify npm package
        run: |
          tar -tzf setup-ubridge-*.tgz
          tar -tzf setup-ubridge-*.tgz | grep -q 'package/libubridge.so'
          tar -tzf setup-ubridge-*.tgz | grep -q 'package/libubridge.dylib'
          tar -tzf setup-ubridge-*.tgz | grep -q 'package/ubridge.dll'

      - name: Publish npm package
        run: npm publish --access public
        env:
           NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: setup-ubridge-*.tgz
